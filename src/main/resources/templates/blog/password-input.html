<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博文访问验证</title>
    <link href="../../static/images/me.jpg" th:href="@{/images/me.jpg}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" href="../../static/lib/semantic/dist/semantic.min.css" th:href="@{/lib/semantic/dist/semantic.min.css}">
    <link rel="stylesheet" href="../../static/css/me.css" th:href="@{/css/me.css}">
    <style>
        .password-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .status-confidential {
            background: #ffeb3b;
            color: #333;
        }
        .status-top-secret {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>

<div class="password-container">
    <div class="ui center aligned header">
        <i class="lock icon"></i>
        <div class="content">
            博文访问验证
        </div>
    </div>
    
    <div class="ui divider"></div>
    
    <div class="ui segment">
        <h4 class="ui header">
            <i class="file text outline icon"></i>
            <div class="content">
                <span th:text="${blogTitle}">博文标题</span>
                <div class="sub header">
                    <span th:if="${blogStatus == 2}" class="status-badge status-confidential">机密</span>
                    <span th:if="${blogStatus == 3}" class="status-badge status-top-secret">绝密</span>
                </div>
            </div>
        </h4>
        
        <div class="ui message info">
            <i class="info circle icon"></i>
            此博文设置了访问密码，请输入正确密码以查看内容。
        </div>
        
        <form id="password-form" class="ui form">
            <div class="field">
                <label>访问密码</label>
                <div class="ui left icon input">
                    <i class="lock icon"></i>
                    <input type="password" id="password-input" placeholder="请输入访问密码" maxlength="20" required>
                </div>
            </div>
            
            <div class="ui error message" id="error-message" style="display: none;"></div>
            
            <div class="ui fluid buttons">
                <button type="button" class="ui button" onclick="goBack()">
                    <i class="arrow left icon"></i>返回
                </button>
                <button type="submit" class="ui teal button">
                    <i class="unlock icon"></i>验证密码
                </button>
            </div>
        </form>
    </div>
    
    <div class="ui center aligned segment">
        <p class="ui text">
            <i class="shield alternate icon"></i>
            密码验证失败3次后将暂时锁定访问
        </p>
    </div>
</div>

<script src="../../static/lib/jquery/jquery.min.js" th:src="@{/lib/jquery/jquery.min.js}"></script>
<script src="../../static/lib/semantic/dist/semantic.min.js" th:src="@{/lib/semantic/dist/semantic.min.js}"></script>

<script>
let attemptCount = 0;
const maxAttempts = 3;

$(document).ready(function() {
    // 表单提交处理
    $('#password-form').on('submit', function(e) {
        e.preventDefault();
        
        const password = $('#password-input').val().trim();
        if (!password) {
            showError('请输入访问密码');
            return;
        }
        
        if (attemptCount >= maxAttempts) {
            showError('密码验证失败次数过多，请稍后再试');
            return;
        }
        
        verifyPassword(password);
    });
    
    // 回车键提交
    $('#password-input').on('keypress', function(e) {
        if (e.which === 13) {
            $('#password-form').submit();
        }
    });
});

function verifyPassword(password) {
    const blogId = /*[[${blogId}]]*/ null;
    
    $.ajax({
        url: '/blog/verify-password',
        type: 'POST',
        data: {
            blogId: blogId,
            password: password
        },
        success: function(response) {
            if (response.startsWith('success:')) {
                // 验证成功，跳转到博文页面
                window.location.href = '/blog/' + blogId;
            } else if (response.startsWith('error:')) {
                // 验证失败
                attemptCount++;
                const errorMsg = response.substring(7); // 移除 "error:" 前缀
                showError(errorMsg);
                
                if (attemptCount >= maxAttempts) {
                    showError('密码验证失败次数过多，请稍后再试');
                    $('#password-input').prop('disabled', true);
                    setTimeout(function() {
                        $('#password-input').prop('disabled', false);
                        attemptCount = 0;
                    }, 30000); // 30秒后重新启用
                }
            }
        },
        error: function() {
            showError('网络错误，请重试');
        }
    });
}

function showError(message) {
    $('#error-message').text(message).show();
    $('#password-input').focus();
}

function goBack() {
    window.history.back();
}
</script>

</body>
</html>
