<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记住密码功能测试</title>
    <link rel="stylesheet" href="../static/lib/semantic/dist/semantic.min.css" th:href="@{/lib/semantic/dist/semantic.min.css}">
    <style>
        .test-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .test-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .test-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .cookie-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .btn-group {
            margin: 15px 0;
        }
        
        .btn-group button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>记住密码功能测试</h2>
        
        <div class="test-section">
            <h3>Cookie 状态检查</h3>
            <div class="cookie-info" id="cookieInfo">
                正在检查Cookie...
            </div>
            <div class="btn-group">
                <button class="ui button" onclick="checkCookies()">刷新Cookie状态</button>
                <button class="ui button red" onclick="clearAllCookies()">清除所有Cookie</button>
            </div>
        </div>
        
        <div class="test-section">
            <h3>测试Cookie操作</h3>
            <div class="ui form">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" id="testUsername" placeholder="输入测试用户名">
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" id="testPassword" placeholder="输入测试密码">
                </div>
                <div class="field">
                    <div class="ui checkbox">
                        <input type="checkbox" id="testRememberMe">
                        <label for="testRememberMe">记住密码</label>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="ui button primary" onclick="setTestCookies()">设置测试Cookie</button>
                    <button class="ui button" onclick="getTestCookies()">读取Cookie</button>
                    <button class="ui button red" onclick="clearTestCookies()">清除测试Cookie</button>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>自动登录测试</h3>
            <p>如果Cookie中有保存的用户名和密码，下面的按钮会模拟自动登录：</p>
            <button class="ui button green" onclick="simulateAutoLogin()">模拟自动登录</button>
            <div id="autoLoginResult" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="../static/lib/jquery-3.2.1/jquery-3.2.1.min.js" th:src="@{/lib/jquery-3.2.1/jquery-3.2.1.min.js}"></script>
    <script src="../static/lib/semantic/dist/semantic.min.js" th:src="@{/lib/semantic/dist/semantic.min.js}"></script>
    <script>
        // 页面加载时检查Cookie
        $(document).ready(function() {
            checkCookies();
        });
        
        // 检查Cookie状态
        function checkCookies() {
            const username = getCookie('remembered_username');
            const password = getCookie('remembered_password');
            
            let cookieInfo = '';
            if (username && password) {
                cookieInfo = `✅ 找到保存的登录信息:\n`;
                cookieInfo += `用户名: ${username}\n`;
                cookieInfo += `密码: ${password.substring(0, 3)}***\n`;
                cookieInfo += `状态: 可以自动登录`;
            } else {
                cookieInfo = `❌ 没有找到保存的登录信息\n`;
                cookieInfo += `用户名: ${username || '未设置'}\n`;
                cookieInfo += `密码: ${password ? password.substring(0, 3) + '***' : '未设置'}\n`;
                cookieInfo += `状态: 需要手动登录`;
            }
            
            $('#cookieInfo').text(cookieInfo);
        }
        
        // 设置测试Cookie
        function setTestCookies() {
            const username = $('#testUsername').val();
            const password = $('#testPassword').val();
            const rememberMe = $('#testRememberMe').is(':checked');
            
            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }
            
            if (rememberMe) {
                setCookie('remembered_username', username, 30);
                setCookie('remembered_password', password, 30);
                alert('Cookie设置成功！');
            } else {
                clearTestCookies();
                alert('已清除Cookie');
            }
            
            checkCookies();
        }
        
        // 读取测试Cookie
        function getTestCookies() {
            const username = getCookie('remembered_username');
            const password = getCookie('remembered_password');
            
            $('#testUsername').val(username || '');
            $('#testPassword').val(password || '');
            $('#testRememberMe').prop('checked', !!(username && password));
        }
        
        // 清除测试Cookie
        function clearTestCookies() {
            deleteCookie('remembered_username');
            deleteCookie('remembered_password');
            checkCookies();
        }
        
        // 清除所有Cookie
        function clearAllCookies() {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
            alert('所有Cookie已清除');
            checkCookies();
        }
        
        // 模拟自动登录
        function simulateAutoLogin() {
            const username = getCookie('remembered_username');
            const password = getCookie('remembered_password');
            
            if (username && password) {
                $('#autoLoginResult').html(`
                    <div class="ui positive message">
                        <div class="header">自动登录成功！</div>
                        <p>用户名: ${username}</p>
                        <p>密码: ${password.substring(0, 3)}***</p>
                        <p>正在跳转到管理后台...</p>
                    </div>
                `);
                
                // 模拟跳转
                setTimeout(function() {
                    window.location.href = '/admin';
                }, 2000);
            } else {
                $('#autoLoginResult').html(`
                    <div class="ui negative message">
                        <div class="header">自动登录失败</div>
                        <p>没有找到保存的登录信息，请先登录并勾选"记住密码"</p>
                    </div>
                `);
            }
        }
        
        // Cookie操作函数
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }
    </script>
</body>
</html>
